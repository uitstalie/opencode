[package]
name = "openrust"
version = "0.0.0-dev"
edition = "2024"
description = "OpenRust AI coding agent — Rust rewrite"
license = "MIT"

[[bin]]
name = "openrust"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# TUI (Phase 1C)
ratatui = "0.28"
crossterm = "0.27"
tui-textarea = "0.6"

# Storage
sled = "0.34"

# Tools
glob = "0.3"
regex = "1"
walkdir = "2"
urlencoding = "2"
hex = "0.4"

# Error handling
thiserror = "1"
anyhow = "1"

# Crypto (Phase 0.9: API key encryption)
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
unicode-width = "0.1"

# Async trait
async-trait = "0.1"

# Stream utilities
futures = "0.3"
async-stream = "0.3"

# Diff (Phase 2)
similar = "2"

# Markdown (Phase 2)
pulldown-cmark = { version = "0.12", default-features = false }

# Syntax highlight (Phase 2) — fancy-regex keeps this pure Rust (no onig/C).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Clipboard (Phase 2)
arboard = "3"

# Fuzzy matching (Phase 2)
# nucleo = "0.5"

# Git (undo blob store — Phase 1A)
# git2 = "0.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
